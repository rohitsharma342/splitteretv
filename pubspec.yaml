name: splitteretv
description: A user-friendly finance mobile app designed to simplify expense sharing among friends, family, and groups.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true